# This workflow is responsible for building and publishing the documentation.
# It is expected to run for changes to main branch after the Pipeline workflow succeeds.

name: Documentation

on:
  # workflow_run:
  #   workflows: 
  #     - "Pipeline"
  #   types: 
  #     - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  documentation:
    strategy:
      # Don't cancel the other matrix values if one fails.
      fail-fast: false
      matrix:
        target: [
          "UUIDConstants",
          "UUIDv1",
          "UUIDv2",
          "UUIDv3",
          "UUIDv4",
          "UUIDv5",
          "UUIDv6",
          "UUIDv7",
          "UUIDv8",
        ]
    uses: Brent-Tunnicliff/workflow-common-apple/.github/workflows/documentation.yml@v2
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    with:
      fetch_depth: 0
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      target: "${{ matrix.target }}"
